
[package]
name = "rust-pdf-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

dotenvy = "0.15"
pdf-extract = "0.12.1"

tower-http = { version = "0.6", features = ["fs"] }
